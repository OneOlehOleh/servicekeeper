# Конфигурация Nginx для МотоЖурнал (MotoLedger)
# Разместите в /etc/nginx/sites-available/moto-ledger.conf
# и создайте симлинк в /etc/nginx/sites-enabled/

# 1. Редирект HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name moto.yourdomain.com; # Укажите ваш домен

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moto.yourdomain.com; # Укажите ваш домен

    # SSL сертификаты (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/moto.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moto.yourdomain.com/privkey.pem;

    # Рекомендуемые параметры безопасности SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Заголовки безопасности и PWA
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Сжатие gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Проксирование запросов к Next.js контейнеру
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Поддержка WebSockets и Keep-Alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Передача реального IP и хоста
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Кэширование статических файлов Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PWA манифест и иконки
    location ~* \.(json|svg|png|ico)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
